<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="job application form, application, validation, regex"
    />
    <meta name="keywords" content="HTML5, apply portal, applicant details" />
    <meta name="author" content="Ruby Telford, 105916092" />
    <title>Apply now at EcoCity Co.</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body class="apply_page">
    <header>
      <nav class="menu">
        <!-- Logo -->
        <a href="index.html" id="logo-link">
          <img src="images/navlogo1.png" alt="EcoCity Co. Logo" />
        </a>

        <!-- Links container -->
        <div class="navlinks">
          <a href="index.html" class="navlink">Home</a>
          <a href="about.html" class="navlink">G02 Team</a>
          <a href="jobs.html" class="navlink">Careers</a>
          <a href="apply.html" class="navlink">Apply Now</a>
        </div>
      </nav>
    </header>
    <main>
      <article>
        <h1>EcoCity Co Job Application Form</h1>
        <form
          action="https://mercury.swin.edu.au/it000000/formtest.php"
          method="post"
        >
          <fieldset>
            <legend>Job Reference Number</legend>
            <p>
              <input
                type="text"
                name="job_ref_num"
                id="job_ref_num"
                maxlength="5"
                pattern="[A-Za-z0-9]{5}"
                size="10"
                required="required"
              />
            </p>
          </fieldset>

          <fieldset>
            <legend>Personal Information</legend>
            <p>
              <label for="first_name"> First Name </label>
              <input
                type="text"
                name="first_name"
                id="first_name"
                maxlength="20"
                pattern="[A-Za-z]{1,20}"
                size="10"
                required="required"
              />
            </p>
            <p>
              <label for="last_name"> Last Name </label>
              <input
                type="text"
                name="last_name"
                id="last_name"
                maxlength="20"
                pattern="[A-Za-z]{1,20}"
                size="10"
                required="required"
              />
            </p>
            <p>
              <label for="dob"> Date of Birth </label>
              <input
                type="text"
                name="dob"
                id="dob"
                pattern="\d{2}/\d{2}/\d{4}"
                placeholder="dd/mm/yyyy"
                required="required"
              />
            </p>
            <fieldset>
              <legend>Gender</legend>
              <label for="female">Female</label>
              <input
                type="radio"
                id="female"
                name="gender"
                value="female"
                required="required"
              />
              &emsp;
              <label for="male">Male</label>
              <input type="radio" id="male" name="gender" value="male" />
              &emsp;
              <label for="other">Other</label>
              <input type="radio" id="other" name="gender" value="other" />
            </fieldset>
          </fieldset>

          <fieldset>
            <legend>Address Details</legend>
            <p>
              <label for="street_address">Street Address</label>
              <input
                type="text"
                name="street_address"
                id="street_address"
                maxlength="50"
                size="10"
                required="required"
              />
            </p>
            <p>
              <label for="suburb_town">Suburb/Town</label>
              <input
                type="text"
                name="suburb_town"
                id="suburb_town"
                maxlength="40"
                size="10"
                required="required"
              />
            </p>
            <p>
              <label for="state">State</label>
              <select name="state" id="state" required="required">
                <option value="">Please Select</option>
                <option value="vic">VIC</option>
                <option value="nsw">NSW</option>
                <option value="qld">QLD</option>
                <option value="nt">NT</option>
                <option value="wa">WA</option>
                <option value="sa">SA</option>
                <option value="tas">TAS</option>
                <option value="act">ACT</option>
              </select>
            </p>
            <p>
              <label for="postcode">Postcode</label>
              <input
                type="text"
                name="postcode"
                id="postcode"
                maxlength="4"
                pattern="\d{4}"
                size="10"
                required="required"
              />
            </p>
          </fieldset>
          <fieldset>
            <legend>Contact Details</legend>
            <p>
              <label for="email">Email</label>
              <input
                type="email"
                name="email"
                id="email"
                size="10"
                required="required"
              />
            </p>
            <p>
              <label for="phone">Phone Number</label>
              <input
                type="text"
                name="phone"
                id="phone"
                maxlength="12"
                pattern="\d{8,12}"
                size="10"
                required="required"
              />
            </p>
          </fieldset>
          <fieldset>
            <legend>Skills</legend>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="iot"
                id="iot"
                required="required"
              />
              <label for="iot">Internet Of Things</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="data"
                id="data"
              /><label for="data">Data Analysis</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="urban"
                id="urban"
              /><label for="urban">Urban Planning</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="renewable"
                id="renewable"
              /><label for="renewable">Renewable Energy</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="problem"
                id="problem"
              /><label for="problem">Problem Solving</label>
            </p>
            <p>
              <input
                type="checkbox"
                name="skill[]"
                value="teamwork"
                id="teamwork"
              /><label for="teamwork">Teamwork</label>
            </p>
            <p></p>
            <p>
              <textarea
                id="other_skills"
                name="other_skills"
                placeholder="Please Add Other Skills Here"
                cols="40"
                rows="6"
              ></textarea>
            </p>
          </fieldset>
          <input type="submit" value="Book" />
          <input type="reset" value="Reset Form" />
        </form>
      </article>
      <footer>
        <h2>Explore more</h2>
        <nav>
          <a
            href="https://nusweek03webtechnologyproject.atlassian.net/jira/software/projects/DEV/boards/1/backlog?atlOrigin=eyJpIjoiZTU1Mjk3NWI3ZTU5NGEyNDgwNDE2NmI2NzgxNmI1MWMiLCJwIjoiaiJ9"
            target="_blank"
          >
            <img
              src="images/jira.png"
              alt="Jira icon"
              title="Go to G02 Tiramisu Jira workspace"
            />Jira Project Space
          </a>
          <a
            href="https://github.com/Ruby-Telford/COS10026-Wed_1430_G02_Tiramisu.git"
            target="_blank"
          >
            <img
              src="images/github.png"
              alt="Github icon"
              title="Go to G02 Github repo"
            />Github Repository
          </a>
          <a href="mailto:questions@EcoCityco.org" target="_blank">
            <img
              src="images/email.png"
              alt="Email icon"
              title="Email EcoCity Co"
            />Email us
          </a>
        </nav>
      </footer>
    </main>
  </body>
</html>
